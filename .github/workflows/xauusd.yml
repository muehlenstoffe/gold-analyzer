name: XAUUSD Daten & Seite

on:
  schedule:
    # GitHub rechnet in UTC: 05:05 UTC = 07:05 Sommerzeit, 06:05 UTC = 07:05 Winterzeit.
    # Der jeweils zu frühe Lauf wird vom Skript automatisch übersprungen.
    - cron: '5 5,6 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'latest = aktuellste Kerzen, cut = Stand 07:00'
        type: choice
        options: [latest, cut]
        default: latest
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: XAU/USD-Kerzen von Dukascopy laden
        env:
          MODE: ${{ github.event.inputs.mode || 'cut' }}
        run: python3 scripts/fetch_xauusd.py

      - name: Daten ins Repository speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "XAUUSD Daten $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v4